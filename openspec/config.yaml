schema: spec-driven

context: |
  本專案是個人筆記與日記 Web 應用，以 zh-TW 撰寫文件、註解與 git message。
  保留 OpenSpec 結構標題及 SHALL/MUST 關鍵字。
  已選定 React＋Vite、Better Auth＋Email magic link、Yjs 即時同步。
  BlockNote 為編輯器評估方向；同步後端以 Durable Objects＋y-partyserver 為方向。
  優先使用 Cloudflare，以 Workers Paid plan 為設計前提。
  docs/v1-scope.md 區分已確認決策、設計提案與待確認事項。
  依 AGENTS.md 使用 TDD；全部開發驗收自動化，規格修改與開發完成後自動提交相關檔案。
  docs/automated-validation.md 定義 Red／Green／Refactor、情境 ID、工具與驗證限制。
  第一版部署前工作已完成。使用者已授權部署至 Cloudflare、設定 note.tonypepe.com、驗證正式登入寄信與同步並自動提交；不封存。使用 OpenSpec 與 TDD，私人密鑰由環境提供，不寫入規格或驗證紀錄。

rules:
  specs:
    - 描述可觀察行為與驗收情境，套件與內部資料結構放在 design.md。
    - 每個 Scenario 指定唯一自動化驗證 ID、工具、輸入或故障與可程式斷言，不得要求人工驗收。
  tasks:
    - 先釐清產品決策；產品選擇是規格輸入，不是人工測試或驗收門檻。
    - 行為採 TDD：Red（正確原因失敗）→ Green（最小實作）→ Refactor（相關測試持續通過），留下自動化報告。
    - 每個任務使用自動化斷言或命令驗證；不得以人工操作、目視截圖、收信或實際手機檢查代替。
    - 完成規格變更後與完成開發後各自自動提交相關檔案；本次先提交規格，再執行已授權的技術驗證。

  proposal:
    - 修改規格後依 AGENTS.md 自動提交相關規格文件，不另要求使用者同意。
